<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Short Link</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔗 Admin Short Link</h1>

        <!-- Bagian Konfigurasi -->
        <section id="konfigurasi" style="display: none;">
            <h2>Pengaturan Awal</h2>
            <p>Masukkan informasi repositori GitHub-mu agar bisa menyimpan link secara otomatis.</p>
            <label>
                Token GitHub (classic) dengan izin <code>repo</code> atau <code>public_repo</code>:<br>
                <input type="password" id="tokenInput" placeholder="ghp_xxxx..." size="40">
                <small><a href="https://github.com/settings/tokens" target="_blank">Buat token baru</a></small>
            </label>
            <label>
                Nama Repositori (format: <code>username/nama-repo</code>):<br>
                <input type="text" id="repoInput" placeholder="username/shortlink">
            </label>
            <button onclick="simpanKonfigurasi()">Simpan & Mulai</button>
        </section>

        <!-- Bagian Manajemen Link (akan muncul setelah konfigurasi) -->
        <section id="manajemen" style="display: none;">
            <h2>Tambah Link Baru</h2>
            <form id="formTambah">
                <input type="text" id="kodeBaru" placeholder="Kode pendek (contoh: promo)" required>
                <input type="url" id="urlBaru" placeholder="URL lengkap (https://...)" required>
                <button type="submit">Tambah</button>
            </form>

            <h2>Daftar Link</h2>
            <ul id="daftarLink">
                <li>Memuat...</li>
            </ul>
        </section>

        <div id="status" class="status"></div>
    </div>

    <script>
        // Ambil token dan repo dari localStorage
        let token = localStorage.getItem('gh_token');
        let repo = localStorage.getItem('gh_repo');
        let dataJsonSha = null;  // SHA file data.json untuk update

        // ---------- INISIALISASI ----------
        if (token && repo) {
            document.getElementById('konfigurasi').style.display = 'none';
            document.getElementById('manajemen').style.display = 'block';
            muatDaftarLink();
        } else {
            document.getElementById('konfigurasi').style.display = 'block';
        }

        // ---------- FUNGSI KONFIGURASI ----------
        function simpanKonfigurasi() {
            const inputToken = document.getElementById('tokenInput').value.trim();
            const inputRepo = document.getElementById('repoInput').value.trim();

            if (!inputToken || !inputRepo) {
                alert('Mohon isi token dan nama repo.');
                return;
            }

            // Simpan ke localStorage
            localStorage.setItem('gh_token', inputToken);
            localStorage.setItem('gh_repo', inputRepo);
            token = inputToken;
            repo = inputRepo;

            // Sembunyikan konfigurasi, tampilkan manajemen
            document.getElementById('konfigurasi').style.display = 'none';
            document.getElementById('manajemen').style.display = 'block';
            muatDaftarLink();
        }

        // ---------- FUNGSI AMBIL DATA DARI GITHUB ----------
        async function getFileSha() {
            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
                    headers: { Authorization: `token ${token}` }
                });
                if (!response.ok) throw new Error('Gagal mengambil data dari GitHub. Cek token/repo.');
                const data = await response.json();
                dataJsonSha = data.sha;  // simpan sha untuk update
                // Kembalikan konten yang sudah di-decode (base64)
                return JSON.parse(atob(data.content));
            } catch (err) {
                setStatus('❌ ' + err.message, 'error');
                throw err;
            }
        }

        // ---------- MUAT DAFTAR LINK ----------
        async function muatDaftarLink() {
            const daftarEl = document.getElementById('daftarLink');
            daftarEl.innerHTML = '<li>Memuat...</li>';
            try {
                const db = await getFileSha(); // sekaligus set dataJsonSha
                renderDaftar(db);
            } catch {
                daftarEl.innerHTML = '<li>Gagal memuat. Periksa token dan koneksi.</li>';
            }
        }

        function renderDaftar(db) {
            const daftarEl = document.getElementById('daftarLink');
            daftarEl.innerHTML = '';
            const kodeList = Object.keys(db);
            if (kodeList.length === 0) {
                daftarEl.innerHTML = '<li>Belum ada link.</li>';
                return;
            }
            kodeList.forEach(kode => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <strong>${kode}</strong> → 
                    <a href="${db[kode]}" target="_blank">${db[kode]}</a>
                    <button onclick="hapusLink('${kode}')" class="btn-hapus">Hapus</button>
                `;
                daftarEl.appendChild(li);
            });
        }

        // ---------- TAMBAH LINK BARU ----------
        document.getElementById('formTambah').addEventListener('submit', async function(e) {
            e.preventDefault();
            const kode = document.getElementById('kodeBaru').value.trim();
            const url = document.getElementById('urlBaru').value.trim();

            if (!kode || !url) return;

            setStatus('Menambahkan...', '');

            try {
                // Ambil database terkini beserta sha
                let db = await getFileSha();

                if (db[kode]) {
                    setStatus('❌ Kode sudah ada. Gunakan kode lain.', 'error');
                    return;
                }

                // Tambahkan entri baru
                db[kode] = url;

                // Update file di GitHub
                await updateDataJson(db, `Menambahkan short link: ${kode}`);
                
                // Reset form dan muat ulang daftar
                document.getElementById('kodeBaru').value = '';
                document.getElementById('urlBaru').value = '';
                await muatDaftarLink();
                setStatus('✅ Link berhasil ditambahkan!', 'success');
            } catch (err) {
                setStatus('❌ ' + err.message, 'error');
            }
        });

        // ---------- HAPUS LINK ----------
        async function hapusLink(kode) {
            if (!confirm(`Yakin hapus link "${kode}"?`)) return;

            setStatus('Menghapus...', '');
            try {
                let db = await getFileSha();
                if (!db[kode]) {
                    setStatus('❌ Kode tidak ditemukan.', 'error');
                    return;
                }

                delete db[kode];
                await updateDataJson(db, `Menghapus short link: ${kode}`);
                await muatDaftarLink();
                setStatus(`✅ Link "${kode}" berhasil dihapus.`, 'success');
            } catch (err) {
                setStatus('❌ ' + err.message, 'error');
            }
        }

        // ---------- UPDATE DATA.JSON KE GITHUB ----------
        async function updateDataJson(dbObject, commitMessage) {
            const content = JSON.stringify(dbObject, null, 2);
            // Encode ke base64 (aman untuk karakter non-ASCII)
            const base64Content = btoa(unescape(encodeURIComponent(content)));

            const body = {
                message: commitMessage,
                content: base64Content,
                sha: dataJsonSha  // SHA file terbaru
            };

            const response = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
                method: 'PUT',
                headers: {
                    Authorization: `token ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Gagal menyimpan perubahan.');
            }

            // Perbarui SHA dengan yang baru (dari respons)
            const result = await response.json();
            dataJsonSha = result.content.sha;
        }

        // ---------- BANTUAN STATUS ----------
        function setStatus(pesan, tipe) {
            const el = document.getElementById('status');
            el.textContent = pesan;
            el.className = 'status ' + tipe;
            if (tipe === 'success') {
                setTimeout(() => { if (el.textContent === pesan) el.textContent = ''; }, 5000);
            }
        }
    </script>
</body>
</html>
