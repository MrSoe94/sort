<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Short Link</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔗 Admin Short Link</h1>

        <!-- Bagian Konfigurasi -->
        <section id="konfigurasi" style="display: none;">
            <h2>Pengaturan Awal</h2>
            <p>Masukkan informasi repositori GitHub-mu agar bisa menyimpan link secara otomatis.</p>
            <label>
                Token GitHub (classic) dengan izin <code>repo</code> atau <code>public_repo</code>:<br>
                <input type="password" id="tokenInput" placeholder="ghp_xxxx..." size="40">
                <small><a href="https://github.com/settings/tokens" target="_blank">Buat token baru</a></small>
            </label>
            <label>
                Nama Repositori (format: <code>username/nama-repo</code>):<br>
                <input type="text" id="repoInput" placeholder="username/shortlink">
            </label>
            <button onclick="simpanKonfigurasi()">Simpan & Mulai</button>
        </section>

        <!-- Bagian Manajemen Link (akan muncul setelah konfigurasi) -->
        <section id="manajemen" style="display: none;">
            <h2>Tambah Link Baru</h2>
            <form id="formTambah">
                <input type="text" id="kodeBaru" placeholder="Kode pendek (contoh: promo)" required>
                <input type="url" id="urlBaru" placeholder="URL lengkap (https://...)" required>
                <button type="submit">Tambah</button>
            </form>

            <h2>Daftar Link</h2>
            <ul id="daftarLink">
                <li>Memuat...</li>
            </ul>
        </section>

        <div id="status" class="status"></div>
    </div>

    <script>
    // Ambil token dan repo dari localStorage
    let token = localStorage.getItem('gh_token');
    let repo = localStorage.getItem('gh_repo');
    let dataJsonSha = null;

    // ---------- INISIALISASI ----------
    if (token && repo) {
        document.getElementById('konfigurasi').style.display = 'none';
        document.getElementById('manajemen').style.display = 'block';
        muatDaftarLink();
    } else {
        document.getElementById('konfigurasi').style.display = 'block';
    }

    // ---------- KONFIGURASI ----------
    function simpanKonfigurasi() {
        const inputToken = document.getElementById('tokenInput').value.trim();
        const inputRepo = document.getElementById('repoInput').value.trim();
        if (!inputToken || !inputRepo) {
            alert('Mohon isi token dan nama repo.');
            return;
        }
        localStorage.setItem('gh_token', inputToken);
        localStorage.setItem('gh_repo', inputRepo);
        token = inputToken;
        repo = inputRepo;
        document.getElementById('konfigurasi').style.display = 'none';
        document.getElementById('manajemen').style.display = 'block';
        muatDaftarLink();
    }

    // ---------- AMBIL DATA & SHA TERBARU ----------
    async function getFileSha() {
        try {
            const response = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
                headers: { Authorization: `token ${token}` }
            });
            if (!response.ok) throw new Error('Gagal mengambil data dari GitHub. Cek token/repo.');
            const data = await response.json();
            dataJsonSha = data.sha;
            return JSON.parse(atob(data.content));
        } catch (err) {
            setStatus('❌ ' + err.message, 'error');
            throw err;
        }
    }

    // ---------- MUAT & TAMPILKAN DAFTAR LINK ----------
    async function muatDaftarLink() {
        const daftarEl = document.getElementById('daftarLink');
        daftarEl.innerHTML = '<li>Memuat...</li>';
        try {
            const db = await getFileSha();
            renderDaftar(db);
        } catch {
            daftarEl.innerHTML = '<li>Gagal memuat. Periksa token dan koneksi.</li>';
        }
    }

    function renderDaftar(db) {
        const daftarEl = document.getElementById('daftarLink');
        daftarEl.innerHTML = '';
        const kodeList = Object.keys(db);
        if (kodeList.length === 0) {
            daftarEl.innerHTML = '<li>Belum ada link.</li>';
            return;
        }

        const [username, repoName] = repo.split('/');

        kodeList.forEach(kode => {
            const shortLink = `https://${username}.github.io/${repoName}/${kode}`;
            const li = document.createElement('li');
            li.innerHTML = `
                <strong>${kode}</strong> → 
                <a href="${db[kode]}" target="_blank" title="${db[kode]}">${db[kode]}</a>
                <div class="btn-group">
                    <button class="btn-copy" data-link="${shortLink}">📋 Salin</button>
                    <button onclick="hapusLink('${kode}')" class="btn-hapus">Hapus</button>
                </div>
            `;
            daftarEl.appendChild(li);
        });

        // Pasang event listener untuk tombol salin
        document.querySelectorAll('.btn-copy').forEach(btn => {
            btn.addEventListener('click', function() {
                const link = this.getAttribute('data-link');
                navigator.clipboard.writeText(link).then(() => {
                    setStatus(`✅ Link disalin: ${link}`, 'success');
                }).catch(() => {
                    const input = document.createElement('input');
                    input.value = link;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    setStatus('✅ Link disalin (fallback)', 'success');
                });
            });
        });
    }

    // ---------- TAMBAH LINK BARU ----------
    document.getElementById('formTambah').addEventListener('submit', async function(e) {
        e.preventDefault();
        const kode = document.getElementById('kodeBaru').value.trim();
        const url = document.getElementById('urlBaru').value.trim();
        if (!kode || !url) return;

        setStatus('Menambahkan...', '');
        try {
            await tambahLink(kode, url);
            document.getElementById('kodeBaru').value = '';
            document.getElementById('urlBaru').value = '';
            setStatus('✅ Link berhasil ditambahkan!', 'success');
        } catch (err) {
            setStatus('❌ ' + err.message, 'error');
        }
        await muatDaftarLink();
    });

    async function tambahLink(kode, url, cobaUlang = true) {
        let db = await getFileSha();
        if (db[kode]) {
            throw new Error('Kode sudah ada. Gunakan kode lain.');
        }
        db[kode] = url;
        try {
            await updateDataJson(db, `Menambahkan short link: ${kode}`);
        } catch (err) {
            if (err.message === 'SHA_MISMATCH' && cobaUlang) {
                // Konflik SHA, muat ulang dan coba lagi
                await muatDaftarLink();
                return tambahLink(kode, url, false); // coba sekali lagi tanpa loop tak terbatas
            }
            throw err;
        }
    }

    // ---------- HAPUS LINK ----------
    async function hapusLink(kode, cobaUlang = true) {
        if (!confirm(`Yakin hapus link "${kode}"?`)) return;

        setStatus('Menghapus...', '');
        try {
            let db = await getFileSha();
            if (!db[kode]) {
                throw new Error('Kode tidak ditemukan.');
            }
            delete db[kode];
            await updateDataJson(db, `Menghapus short link: ${kode}`);
            await muatDaftarLink();
            setStatus(`✅ Link "${kode}" berhasil dihapus.`, 'success');
        } catch (err) {
            if (err.message === 'SHA_MISMATCH' && cobaUlang) {
                setStatus('🔄 Data sudah berubah, menyegarkan...', '');
                await muatDaftarLink();
                return hapusLink(kode, false); // coba lagi
            }
            setStatus('❌ ' + err.message, 'error');
            await muatDaftarLink(); // refresh daftar meskipun gagal
        }
    }

    // ---------- UPDATE DATA.JSON (DENGAN DETEKSI SHA KONFLIK) ----------
    async function updateDataJson(dbObject, commitMessage) {
        const content = JSON.stringify(dbObject, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(content)));
        const body = {
            message: commitMessage,
            content: base64Content,
            sha: dataJsonSha
        };

        const response = await fetch(`https://api.github.com/repos/${repo}/contents/data.json`, {
            method: 'PUT',
            headers: {
                Authorization: `token ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });

        if (!response.ok) {
            const errorData = await response.json();
            // Deteksi SHA mismatch (biasanya status 409 atau 422 dengan pesan "does not match")
            if (response.status === 409 || response.status === 422 ||
                (errorData.message && errorData.message.includes('does not match'))) {
                throw new Error('SHA_MISMATCH'); // lempar error khusus
            }
            throw new Error(errorData.message || 'Gagal menyimpan perubahan.');
        }

        const result = await response.json();
        dataJsonSha = result.content.sha; // perbarui SHA dengan yang baru
    }

    // ---------- STATUS BAR & TOMBOL REFRESH ----------
    function setStatus(pesan, tipe) {
        const el = document.getElementById('status');
        el.textContent = pesan;
        el.className = 'status ' + tipe;
        if (tipe === 'success') {
            setTimeout(() => { if (el.textContent === pesan) el.textContent = ''; }, 5000);
        }
    }

    // Tambahkan tombol refresh di atas daftar (opsional, tapi membantu)
    document.addEventListener('DOMContentLoaded', function() {
        const headerDaftar = document.querySelector('#manajemen h2');
        if (headerDaftar) {
            const btnRefresh = document.createElement('button');
            btnRefresh.textContent = '🔄 Refresh Data';
            btnRefresh.style.marginLeft = '1em';
            btnRefresh.onclick = () => {
                setStatus('Memperbarui...', '');
                muatDaftarLink().then(() => setStatus('✅ Data terbaru dimuat.', 'success'));
            };
            headerDaftar.appendChild(btnRefresh);
        }
    });
</script>
</body>
</html>
