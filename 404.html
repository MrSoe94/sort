<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 2em; background: #f5f5f5; }
    </style>
</head>
<body>
    <h2>Mengalihkan...</h2>
    <p id="pesan">Mohon tunggu sebentar.</p>

    <script>
        (async function() {
            // Ambil semua bagian path (contoh: "/sort/Absensi-Sekolah" -> ["sort", "Absensi-Sekolah"])
            const segmen = window.location.pathname.split('/').filter(Boolean);
            const repo = segmen[0] || '';   // "sort"
            const kode = segmen[1] || '';   // "Absensi-Sekolah"

            if (!kode) {
                document.body.innerHTML = '<h2>404 - Tidak ada kode</h2>';
                return;
            }

            const dataUrl = '/' + repo + '/data.json';
            console.log('Fetching database dari:', dataUrl);

            try {
                const response = await fetch(dataUrl);
                if (!response.ok) throw new Error('Gagal memuat database (status ' + response.status + ')');
                const db = await response.json();
                console.log('Database:', db);

                const urlTujuan = db[kode];
                if (urlTujuan) {
                    window.location.replace(urlTujuan);
                } else {
                    document.getElementById('pesan').textContent =
                        `Maaf, link pendek "/${kode}" tidak ditemukan di database.`;
                    document.querySelector('h2').textContent = '404 - Tidak Ditemukan';
                    console.log('Kode yang dicari:', kode, 'tersedia:', Object.keys(db));
                }
            } catch (err) {
                document.getElementById('pesan').textContent = 'Gagal menghubungi server data.';
                console.error('Error:', err);
            }
        })();
    </script>
</body>
</html>
